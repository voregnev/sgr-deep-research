services:
  sgr-api:
    build:
      context: ..
      dockerfile: services/api_service/Dockerfile
    container_name: sgr-deep-research-api
    restart: unless-stopped

    ports:
      - "8010:8010"
    volumes:
      - ../sgr_deep_research:/app/sgr_deep_research:ro
      - ../config.yaml:/app/config.yaml:ro
      -  ./logs:/app/logs
      -  ./reports:/app/reports

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  sgr-chainlit:
    build:
      context: ..
      dockerfile: services/chainlit_service/Dockerfile
    container_name: sgr-deep-research-chainlit
    restart: unless-stopped

    ports:
      - "8000:8000"
    volumes:
      - ../config.yaml:/app/config.yaml:ro
      -  ./reports:/app/reports

    depends_on:
      - sgr-api

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
